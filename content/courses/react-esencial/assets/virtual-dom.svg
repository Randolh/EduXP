<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="240">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="240" rx="14" fill="#0d1527" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Step 1: Estado -->
  <g transform="translate(40, 60)" filter="url(#cardShadow)">
    <rect width="140" height="110" rx="10" fill="#141f36" stroke="rgba(0,245,160,0.3)" stroke-width="1.5"/>
    <circle cx="70" cy="38" r="18" fill="rgba(0,245,160,0.15)"/>
    <text x="70" y="44" fill="#00f5a0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="70" y="78" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Cambio de Estado</text>
    <text x="70" y="96" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">setState() / useState</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 195 115 L 245 115" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <polygon points="245,110 255,115 245,120" fill="#38bdf8"/>

  <!-- Step 2: Virtual DOM -->
  <g transform="translate(270, 60)" filter="url(#cardShadow)">
    <rect width="150" height="110" rx="10" fill="#141f36" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <circle cx="75" cy="38" r="18" fill="rgba(56,189,248,0.15)"/>
    <text x="75" y="44" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚛</text>
    <text x="75" y="78" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Virtual DOM</text>
    <text x="75" y="96" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Cálculo de Diffing</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 435 115 L 485 115" stroke="#00f5a0" stroke-width="2" fill="none"/>
  <polygon points="485,110 495,115 485,120" fill="#00f5a0"/>

  <!-- Step 3: Real DOM -->
  <g transform="translate(510, 60)" filter="url(#cardShadow)">
    <rect width="145" height="110" rx="10" fill="#141f36" stroke="url(#mintGrad)" stroke-width="1.5"/>
    <circle cx="72" cy="38" r="18" fill="rgba(0,245,160,0.2)"/>
    <text x="72" y="44" fill="#00f5a0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🌐</text>
    <text x="72" y="78" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Navegador Real</text>
    <text x="72" y="96" fill="#00f5a0" font-family="sans-serif" font-size="10" text-anchor="middle">Actualización Selectiva</text>
  </g>

  <!-- Header Title -->
  <text x="350" y="32" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">FLUJO DE RENDERIZADO REACT</text>
</svg>
