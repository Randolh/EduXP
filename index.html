<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduXP | Guías de Programación</title>
  <meta name="description" content="Plataforma de guías 100% gratuitas para adentrarte en cualquier tecnología, herramienta o lenguaje de programación con lecciones prácticas en Markdown.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Prism.js para resaltado de código Markdown -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />

  <!-- Marked.js Markdown Parser (v9.1.6 LTS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <!-- Prism.js y componentes de lenguajes -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

  <!-- Hojas de Estilo EduXP (Arquitectura Modular) -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Header de Navegación -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#/" class="brand-logo">
        <div class="logo-icon-wrap">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Edu<span class="brand-accent">XP</span></span>
          <span class="brand-tag">Open Learning</span>
        </div>
      </a>

      <!-- Navegación de escritorio -->
      <nav class="nav-links" id="nav-links">
        <a href="#/" class="nav-link" data-route="home">
          <i class="fa-solid fa-house"></i> Inicio
        </a>
        <a href="#/courses" class="nav-link" data-route="courses">
          <i class="fa-solid fa-layer-group"></i> Cursos
        </a>
        <a href="#/library" class="nav-link" data-route="library">
          <i class="fa-solid fa-book-bookmark"></i> Mi Biblioteca
        </a>
      </nav>

      <!-- Acciones de barra -->
      <div class="nav-actions">
        <div class="progress-pill" id="global-progress-pill" title="Tu progreso global">
          <i class="fa-solid fa-bolt text-mint"></i>
          <span class="progress-pill-text" id="global-progress-text">0 lecciones</span>
        </div>
        <div class="nav-auth-wrap" id="nav-auth-wrap"></div>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm" id="repo-link" title="Ver repositorio de contenido">
          <i class="fa-brands fa-github"></i>
        </a>
        <button class="mobile-toggle" id="mobile-toggle" aria-label="Abrir menú de navegación">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal de la SPA -->
  <main class="app-viewport" id="app">
    <div class="app-loader">
      <div class="loader-spinner"></div>
      <p class="loader-text">Cargando experiencia EduXP...</p>
    </div>
  </main>

  <!-- Footer -->
  <!-- Footer Simplificado -->
  <footer class="footer" id="footer">
    <div class="footer-container-simple">
      <div class="footer-brand-simple">
        <div class="brand-logo">
          <div class="logo-icon-wrap sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="brand-name">Edu<span class="brand-accent">XP</span></span>
        </div>
        <p class="footer-simple-text">Plataforma libre para aprender desarrollo de software.</p>
      </div>

      <div class="footer-social-links">
        <a href="https://github.com/Randolh" target="_blank" rel="noopener noreferrer" class="social-link" title="GitHub">
          <i class="fa-brands fa-github"></i> <span>GitHub</span>
        </a>
        <a href="https://www.linkedin.com/in/randolh/" target="_blank" rel="noopener noreferrer" class="social-link" title="LinkedIn">
          <i class="fa-brands fa-linkedin"></i> <span>LinkedIn</span>
        </a>
        <a href="https://randolh.github.io/portfolio/" target="_blank" rel="noopener noreferrer" class="social-link" title="Portafolio">
          <i class="fa-solid fa-globe"></i> <span>Portafolio</span>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="footer-bottom-container">
        <p>© 2026 EduXP. Developed by Randolh. 100% Libre y de código abierto.</p>
        <div class="footer-status">
          <span class="status-dot"></span>
          <span id="footer-source-label">Fuente: GitHub (Randolh/Content_EduXP)</span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Sistema de Notificaciones Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Script Principal de la SPA (ES Modules) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
